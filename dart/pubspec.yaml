name: apiverve_imagetopdf
description: "Image to PDF combines up to 20 images, uploaded or fetched from URLs, into one PDF with one image per page, and returns a download link valid for 2 days. Pages can match each image or be A4, Letter or Legal with a margin, and multi-page TIFF scans and animated GIFs become one page per frame."
version: 1.2.6
homepage: https://apiverve.com/marketplace/imagetopdf?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/imagetopdf-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
